# GitHub Copilot Code Review Configuration
# Documentation: https://docs.github.com/en/copilot/using-github-copilot/code-review

reviews:
  auto_review: true
  high_level_summary: true

  review_scope:
    focus_areas:
      - correctness
      - security
      - performance
      - maintainability
      - best_practices

  path_filters:
    include:
      - "**/*.go"
      - "**/*.md"
    exclude:
      - "**/vendor/**"
      - "**/*.generated.*"

  instructions_file: .github/copilot-instructions.md
